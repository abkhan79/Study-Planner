<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Sprint 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1, h2 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>📚 Study Planner Dashboard</h1>
    
    <!-- US-01: Add Assignment Form -->
    <div class="card">
        <h2>Add New Assignment</h2>
        <form id="assignmentForm">
            <div class="form-group">
                <label for="title">Assignment Title</label>
                <input type="text" id="title" placeholder="e.g., Sprint 1 Report">
                <div id="titleError" class="error">Title is required.</div>
            </div>
            
            <div class="form-group">
                <label for="course">Course Name</label>
                <input type="text" id="course" placeholder="e.g., CS 319">
            </div>
            
            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate">
                <div id="dateError" class="error">Please select a valid future date.</div>
            </div>
            
            <button type="submit">Save Assignment</button>
        </form>
    </div>

    <!-- US-02: Assignments List (Sorted) -->
    <div class="card">
        <h2>Upcoming Assignments</h2>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                </tr>
            </thead>
            <tbody id="assignmentTableBody">
                <!-- Assignments will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        // Set up references to UI elements
        const form = document.getElementById('assignmentForm');
        const titleInput = document.getElementById('title');
        const courseInput = document.getElementById('course');
        const dueDateInput = document.getElementById('dueDate');
        const tableBody = document.getElementById('assignmentTableBody');
        
        const titleError = document.getElementById('titleError');
        const dateError = document.getElementById('dateError');

        // Load existing assignments from LocalStorage on page load
        let assignments = JSON.parse(localStorage.getItem('assignments')) || [];

        // Function to render the assignments to the screen, sorted by date
        function displayAssignments() {
            // Sort by due date (closest date first)
            assignments.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Clear current list content
            tableBody.innerHTML = '';
            
            // Rebuild the table rows
            assignments.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.title}</strong></td>
                    <td>${item.course || 'N/A'}</td>
                    <td>${item.date}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Form submission logic
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page refresh
            
            // Reset error displays
            titleError.style.display = 'none';
            dateError.style.display = 'none';
            
            let isValid = true;
            const titleValue = titleInput.value.trim();
            const courseValue = courseInput.value.trim();
            const dateValue = dueDateInput.value;

            // 1. Validation Logic
            if (titleValue === "") {
                titleError.style.display = 'block';
                isValid = false;
            }

            if (dateValue === "") {
                dateError.innerText = "Please select a date.";
                dateError.style.display = 'block';
                isValid = false;
            } else {
                // Ensure date isn't in the past
                const today = new Date();
                today.setHours(0,0,0,0);
                const selectedDate = new Date(dateValue);
                // Adjusting for timezones
                selectedDate.setMinutes(selectedDate.getMinutes() + selectedDate.getTimezoneOffset());
                
                if (selectedDate < today) {
                    dateError.innerText = "Due date cannot be in the past.";
                    dateError.style.display = 'block';
                    isValid = false;
                }
            }

            // 2. If valid, save the item
            if (isValid) {
                const newAssignment = {
                    title: titleValue,
                    course: courseValue,
                    date: dateValue
                };

                assignments.push(newAssignment);
                localStorage.setItem('assignments', JSON.stringify(assignments)); // Explicit storage
                
                displayAssignments(); // Update the UI list
                form.reset(); // Clear input fields
            }
        });

        // Initialize display on startup
        displayAssignments();
    </script>
</body>
</html>
