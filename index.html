<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Sprint 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1, h2 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .completed-row td:nth-child(2),
        .completed-row td:nth-child(3),
        .completed-row td:nth-child(4) {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>📚 Study Planner Dashboard</h1>

    <!-- US-01: Add Assignment Form -->
    <div class="card">
        <h2>Add New Assignment</h2>
        <form id="assignmentForm">
            <div class="form-group">
                <label for="title">Assignment Title</label>
                <input type="text" id="title" placeholder="e.g., Sprint 2 Report">
                <div id="titleError" class="error">Title is required.</div>
            </div>

            <div class="form-group">
                <label for="course">Course Name</label>
                <input type="text" id="course" placeholder="e.g., CS 319">
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate">
                <div id="dateError" class="error">Please select a valid future date.</div>
            </div>

            <button type="submit">Save Assignment</button>
        </form>
    </div>

    <!-- US-02 & US-03: Assignments List -->
    <div class="card">
        <h2>Upcoming Assignments</h2>
        <table>
            <thead>
                <tr>
                    <th>Done</th>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                </tr>
            </thead>
            <tbody id="assignmentTableBody">
            </tbody>
        </table>
    </div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
